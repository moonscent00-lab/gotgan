.task.prep{background:var(--accent-soft)}
.task.thaw{background:var(--frost-soft)}

details.recipe .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ing span{background:var(--accent-soft);border-radius:8px;padding:3px 8px;font-size:.85rem}
ol.steps{margin:6px 0 0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
.tip{margin-top:10px;font-size:.85rem;color:var(--muted)}
.cat{font-size:.78rem;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:8px 0 -4px}
.reset{align-self:flex-start;font:500 .8rem var(--body);color:var(--muted);background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.reset.armed{color:var(--surface);background:var(--muted);border-style:solid}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>

const KEY="jia-oct-mealplan-v1";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){state={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function cb(id,text,qty){return `<label class="check"><input type="checkbox" id="${id}" data-k="${id}" ${state[id]?"checked":""}><span class="t">${esc(text)}</span>${qty?`<span class="q">${esc(qty)}</span>`:""}</label>`}

const todayStr=(()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")})();

function renderShop(){
  const all=[...SHOP.flatMap(g=>g.items.map(i=>i[0])),...LOCAL.map(i=>i[0])];
  let h=`<div class="progress"><span id="shopCount"></span><div class="bar"><i id="shopBar"></i></div></div>
  <p class="note">오늘 저녁 마트 · 예상 10~12만원 (캡슐커피 제외) · <b>다이소카드</b>로 결제. 김치·굴소스·참기름·올리브유·계란은 집에 있어요.</p>`;
  SHOP.forEach(g=>{h+=`<div class="group"><h3>${esc(g.g)}</h3>${g.items.map(i=>cb(i[0],i[1],i[2])).join("")}</div>`});
  h+=`<h2>동네에서 그때그때</h2><div class="group">${LOCAL.map(i=>cb(i[0],i[1],i[2])).join("")}</div>
  <button class="reset" data-reset="s-,l-">장보기 체크 모두 지우기</button>`;
  document.getElementById("shop").innerHTML=h;
  const upd=()=>{const n=all.filter(k=>state[k]).length;document.getElementById("shopCount").textContent=`${n} / ${all.length} 담음`;document.getElementById("shopBar").style.width=(n/all.length*100)+"%"};
  upd();document.getElementById("shop").addEventListener("change",upd);
}

function link(x){return x?(x[1]?`<a href="#${x[1]}" data-recipe="${x[1]}">${esc(x[0])}</a>`:esc(x[0])):"—"}
function renderDays(){
  let h=`<p class="note">노란 테두리가 오늘이에요. 메뉴를 누르면 레시피로 가요.</p>`;
  DAYS.forEach((d,i)=>{
    const isT=d.d===todayStr, past=d.d<todayStr;
    h+=`<article class="day${isT?" is-today":""}${past?" past":""}" id="day-${d.d}">
      <div class="head"><span class="date">${d.label}</span>${isT?'<span class="pill today">오늘</span>':""}${d.swim?'<span class="pill swim">⚡ 수영</span>':""}</div>
      <div class="row"><span class="k">아침</span><span>${link(d.b)}</span></div>
      <div class="row"><span class="k">저녁</span><span>${link(d.dn)}</span></div>
      ${d.prep?`<div class="task prep">${cb("p-"+d.d,"할 일 · "+d.prep[0])}</div>`:""}
      ${d.thaw?`<div class="task thaw">${cb("t-"+d.d,"자기 전 해동 · "+d.thaw)}</div>`:""}
    </article>`;
  });
  document.getElementById("days").innerHTML=h;
}

function renderRecipes(){
  let h="";
  RECIPES.forEach(r=>{
    if(r.cat){h+=`<div class="cat">${esc(r.cat)}</div>`;return}
    h+=`<details class="recipe" id="${r.id}"><summary><span class="nm">${esc(r.n)}</span><span class="meta">${esc(r.m)}</span></summary>
      <div class="body"><div class="ing">${r.ing.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
      <ol class="steps">${r.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${r.tip?`<div class="tip">💡 ${esc(r.tip)}</div>`:""}</div></details>`;
  });
  document.getElementById("recipes").innerHTML=h;
}

function renderThaw(){
  const list=DAYS.filter(d=>d.thaw);
  let h=`<p class="note">자기 전에 냉동실 → 냉장실로 옮기기. 다음 날 그대로 요리하면 돼요.</p><div class="group">`;
  list.forEach(d=>{
    const next=DAYS[DAYS.indexOf(d)+1];
    h+=cb("t-"+d.d,`${d.label} 밤 · ${d.thaw}`,next?`→ ${next.label.split(" ")[0]} ${next.dn[0]}`:"");
  });
  h+=`</div><button class="reset" data-reset="t-,p-">해동·할 일 체크 모두 지우기</button>`;
  document.getElementById("thaw").innerHTML=h;
}

renderShop();renderDays();renderRecipes();renderThaw();

document.addEventListener("change",e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  state[k]=e.target.checked;save();
  document.querySelectorAll(`[data-k="${k}"]`).forEach(el=>{el.checked=e.target.checked});
});

document.addEventListener("click",e=>{
  const r=e.target.closest(".reset");
  if(r){
    if(!r.classList.contains("armed")){r.classList.add("armed");r.dataset.label=r.textContent;r.textContent="한 번 더 누르면 지워져요";setTimeout(()=>{r.classList.remove("armed");r.textContent=r.dataset.label},3000);return}
    const pre=r.dataset.reset.split(",");Object.keys(state).forEach(k=>{if(pre.some(p=>k.startsWith(p)))delete state[k]});save();
    renderShop();renderDays();renderThaw();show(current);return;
  }
  const a=e.target.closest("[data-recipe]");
  if(a){e.preventDefault();openRecipe(a.dataset.recipe)}
});

let current="shop";
function show(t){
  current=t;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false"));
  document.querySelectorAll("section.panel").forEach(s=>{s.hidden=s.id!==t});
  try{localStorage.setItem(KEY+"-tab",t)}catch(e){}
}
function openRecipe(id){
  show("recipes");const el=document.getElementById(id);if(!el)return;
  el.open=true;el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{
  show(b.dataset.tab);window.scrollTo({top:0});
  if(b.dataset.tab==="days"){const t=document.getElementById("day-"+todayStr);if(t)t.scrollIntoView({block:"start"})}
}));

(function init(){
  const h=(location.hash||"").slice(1);
  if(["shop","days","recipes","thaw"].includes(h)){show(h);return}
  if(h.startsWith("r-")&&document.getElementById(h)){openRecipe(h);return}
  let saved=null;try{saved=localStorage.getItem(KEY+"-tab")}catch(e){}
  show(saved||(todayStr<="2026-10-20"?"shop":"days"));
})();
</script>
