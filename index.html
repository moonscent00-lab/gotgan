<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>곳간</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f1e7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="곳간">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2520; --sub:#7a6f63; --line:#e6dccb;
  --accent:#b5652b; --accent-soft:#f3e2d2; --green:#4f7a52; --green-soft:#e2eddc;
  --red:#b8473a; --red-soft:#f6dfda; --amber:#a7791f; --amber-soft:#f5ead0;
  --c-in:#2f72b8; --c-out:#c0651f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d1a17; --card:#27231f; --ink:#f1ebe2; --sub:#a99d8f; --line:#3a342d;
    --accent:#e08a4c; --accent-soft:#3c2b1f; --green:#86b489; --green-soft:#24331f;
    --red:#e27b6d; --red-soft:#3b2421; --amber:#d9ad55; --amber-soft:#3a3020; --c-in:#5a96d4; --c-out:#cc7838; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:'Gowun Dodum',sans-serif;font-weight:400;margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(130px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:12px}
header h1{font-size:24px;flex:1}
input[type=month]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px}
.ghost{background:none;border:none;color:var(--sub);cursor:pointer;padding:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;max-width:180px;background:none;border:none;padding:10px 0 12px;color:var(--sub);cursor:pointer;font-size:13px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.card h2{font-size:19px;margin-bottom:8px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 8px;font-size:13px}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--green)} .minus{color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--sub)} .stat .v{font-size:18px;font-weight:700}
.alert{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.alert.warn{background:var(--amber-soft);color:var(--amber)}
.alert.bad{background:var(--red-soft);color:var(--red)}
.alert.ok{background:var(--green-soft);color:var(--green)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green)}
.bar i.over{background:var(--red)}
.catline{padding:8px 0;border-bottom:1px dashed var(--line)}
.catline:last-child{border-bottom:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.tx.review{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
.tx.child{margin-left:18px;border-style:dashed}
.tx .t1{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.tx .t1 span:first-child{overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12px;color:var(--sub);margin-top:2px}
.tx .t3{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tx select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 6px;font-size:13px;max-width:100%}
.tag{font-size:11px;border-radius:6px;padding:2px 6px;background:var(--bg);color:var(--sub)}
.tag.env{background:var(--green-soft);color:var(--green)}
.tag.exc{background:var(--line)}
.tag.memo{background:var(--accent-soft);color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:13px;color:var(--sub)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:15px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.grid2>*{min-width:0}
.field input,.field select,.field textarea{width:100%;min-width:0;max-width:100%}
html,body{overflow-x:hidden;max-width:100%}
.budget-row{display:grid;grid-template-columns:1fr 120px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.budget-row input{text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;width:100%}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#login .card{width:100%;max-width:360px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;white-space:nowrap}
#tip.on{opacity:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:96px minmax(0,1fr) 86px;gap:8px;align-items:center;padding:5px 0;cursor:pointer;font-size:13px}
.hbar:hover{background:var(--bg);border-radius:8px}
.hbar .t{height:12px;background:var(--line);border-radius:4px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--c-out);border-radius:0 4px 4px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;color:var(--sub)}
.drop:hover{border-color:var(--accent);color:var(--accent)}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini td{padding:5px 0;border-bottom:1px dashed var(--line)}
table.mini td:last-child{text-align:right}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card">
    <h1 style="font-size:30px">🌾 곳간</h1>
    <p class="muted">우리집 살림 정산</p>
    <label class="field">이메일<input id="email" type="email" autocomplete="username"></label>
    <label class="field">비밀번호<input id="pw" type="password" autocomplete="current-password"></label>
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="doLogin()">들어가기</button>
    <p id="loginErr" class="muted" style="color:var(--red)"></p>
  </div>
</div>

<div id="app" hidden>
  <header><div class="wrap">
    <h1>🌾 곳간</h1>
    <input type="month" id="month" onchange="setMonth(this.value)">
    <button class="ghost" onclick="doLogout()" title="로그아웃">⎋</button>
  </div></header>
  <main class="wrap" id="view"></main>
  <nav>
    <button data-tab="settle" onclick="go('settle')"><b>🧾</b>정산</button>
    <button data-tab="ledger" onclick="go('ledger')"><b>📒</b>내역</button>
    <button data-tab="budget" onclick="go('budget')"><b>🎯</b>예산</button>
    <button data-tab="loans" onclick="go('loans')"><b>🏦</b>빚·대출</button>
    <button data-tab="food" onclick="go('food')"><b>🍚</b>살림</button>
  </nav>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="tip"></div>
<input type="file" id="file" accept=".xlsx,.xls" hidden onchange="importFile(this.files[0]);this.value=''">
<input type="file" id="planFile" accept=".html,.htm,text/html" hidden onchange="uploadPlan(this.files[0]);this.value=''">

<!-- ===== 핵심 규칙 (분류·엑셀 읽기) ===== -->
<script id="core">
const CATS = [
  {name:'① 고정비', group:'지출', subs:['대출-사업','대출-지아','통신','공과금','구독료','주차비','건보/연금']},
  {name:'② 보험료', group:'지출', subs:['지아','종수']},
  {name:'④ 생활비', group:'지출', subs:['식재료','생활용품','반려동물','외식/배달']},
  {name:'⑤ 데이트·힐링', group:'지출', subs:[]},
  {name:'⑥ 종수 용돈', group:'지출', subs:[]},
  {name:'⑦ 지아 용돈', group:'지출', subs:[]},
  {name:'⑧ 건강', group:'지출', subs:['영양제','운동','병원/약국']},
  {name:'⑨ 엄마', group:'지출', subs:['용돈','선물','보험','CCTV','헤모힘']},
  {name:'⑩ 시부모님', group:'지출', subs:['용돈','선물','헤모힘']},
  {name:'⑪ 비정기', group:'지출', subs:['경조사','자기계발','가전/가구','큰수리비']},
  {name:'⑫ 차량·교통', group:'지출', subs:['기름값','하이패스','대중교통','차량수리/유지비']},
  {name:'빌린 돈 갚기', group:'가계 제외', subs:['엄마','시어머니']},
  {name:'③ 저축', group:'저축', subs:['달러종신','적금','저금통','투자']},
  {name:'생활비 받음', group:'수입', subs:[]},
  {name:'사업소득', group:'수입', subs:['애터미','에이티에셋','슈가펫','달내음','부수입']},
  {name:'금융수입', group:'수입', subs:['이자','배당금','앱테크']},
  {name:'기타수입', group:'수입', subs:['환불·환급','중고판매','기타']},
  {name:'🚫 내 통장끼리', group:'가계 제외', subs:['계좌 이동','페이 충전','현금 인출']},
  {name:'🚫 카드대금', group:'가계 제외', subs:['삼성다이소-지아','삼성리더스-종수','KB국민-지아','KB국민-종수','하나애터미-지아','신한모베럴웍스-지아']},
  {name:'🚫 사업비', group:'가계 제외', subs:['애터미영업비','보험영업비']},
  {name:'🚫 사업 이체', group:'가계 제외', subs:['슈가펫','달내음']},
  {name:'🚫 대납', group:'가계 제외', subs:[]},
  {name:'🚫 대납 환급', group:'가계 제외', subs:[]},
  {name:'🚫 빌린 돈', group:'가계 제외', subs:['엄마','시어머니']},
  {name:'❓ 확인 필요', group:'확인', subs:[]},
];
const EXP_CATS = CATS.filter(c=>c.group==='지출').map(c=>c.name);
const INCOME_CATS = new Set(CATS.filter(c=>c.group==='수입').map(c=>c.name));
const REVIEW = '❓ 확인 필요';
// 봉투: 이 결제수단으로 쓴 건 "봉투 안에서 쓴 돈"(합계 중복 X)
const ENV = {
  '⑤ 데이트·힐링': /모임\s*체크카드/,
  '⑦ 지아 용돈': /토스뱅크\s*(체크카드|통장)/,
};

const norm = s => String(s ?? '').replace(/[①-⑳🚫❓]/gu,'').replace(/\s+/g,'').trim();
const catOf = name => CATS.find(c=>c.name===name);
function pickSub(cat, minor){
  const c = catOf(cat); if(!c) return '';
  const m = norm(minor); if(!m || m==='미분류') return '';
  return c.subs.find(s=>norm(s)===m) || '';
}
function treatmentOf(cat, row){
  if(!cat || cat===REVIEW) return 'review';
  if(cat==='③ 저축') return 'savings';
  if(cat==='🚫 대납') return 'advance';
  if(cat==='🚫 대납 환급') return 'advance_refund';
  if(cat==='🚫 빌린 돈') return 'borrow';
  if(cat==='빌린 돈 갚기') return 'borrow_repay';   // 빌린 돈이 수입에서 빠지니 갚는 돈도 지출에서 뺌 (빚 장부로만)
  if(cat.startsWith('🚫')) return 'exclude';
  if(INCOME_CATS.has(cat)) return 'income';
  if(ENV[cat] && ENV[cat].test(row.method||'')) return 'envelope';
  if(cat==='⑤ 데이트·힐링' && row.type!=='이체' && !(/데이트\s*비/.test(row.merchant||'') && !/모임/.test(row.method||''))) return 'envelope';   // "10월데이트비용"처럼 모임통장에 넣는 돈은 지출로 셈   // 데이트비는 어떤 카드로 냈든 결국 모임통장 돈 (다른 카드로 내면 모임통장에서 옮겨 채움)
  return 'count';
}
const R = (category, subcategory='', extra={}) => ({category, subcategory, ...extra});
const realMinor = m => { const s=String(m??'').trim(); return s && s!=='미분류' ? s : ''; };

const NO_MEMORY = /ATOMY|애터미/i;   // 같은 가게라도 매번 용도가 달라서 기억하지 않음
function classify(row, rules){
  if(NO_MEMORY.test(row.merchant||'')) rules=[];
  if(realMinor(row.bs_major)) rules=[];   // 뱅크샐러드에서 분류해둔 건 그걸 먼저 따름 (곳간에서 기억한 규칙은 미분류일 때만)
  const r1 = rules.find(r=>r.match_field==='merchant' && r.match_value===row.merchant);
  if(r1) return R(r1.category, r1.subcategory||'');
  const r2 = rules.find(r=>r.match_field==='method' && r.match_value===row.method);
  if(r2) return R(r2.category, r2.subcategory||'');

  const t=row.type, maj=norm(row.bs_major), min=realMinor(row.bs_minor), minN=norm(min);
  const m=row.method||'', name=row.merchant||'', amt=row.amount;

  // ── 지아님이 뱅크샐러드에 만든 분류 (대분류 + 소분류) ──
  // 소분류를 곳간 소분류와 같은 이름으로 해두면 그대로 씀. 없으면 내용(가게 이름)으로 추측
  const inParenRaw = (name.match(/\(([^)]+)\)/)||[])[1] || '';
  const inParen = inParenRaw.split(/[-_/]/)[0].trim();   // ATOMY(김애숙-고등어) → 김애숙
  const beforeParen = name.split('(')[0].trim();
  const isLoan = /정책금|원리금|대출/.test(name);
  const loanSub = /IBK|기업/.test(m) ? '대출-지아' : '대출-사업';
  const sub = (cat, guess) => min || guess || '';   // 뱅크샐러드 소분류를 그대로 (새로 만들거나 바꿔도 따라감)
  const memoWho = (String(row.memo||'').match(/^\s*([^\s\-_/]+)\s*[-_/]/)||[])[1] || '';
  const dashWho = (beforeParen.match(/^([^\s\-_/]+)\s*[-_/]/)||[])[1] || '';
  const who = fallback => min || memoWho || fallback;     // 이름-품목: 메모 → 내용 괄호 → 내용 앞부분
  const sidae = /시부모|어머님|아버님|시어머니|시아버지|시댁/;
  if(t==='지출'){
    if(maj==='고정비') return R('① 고정비', sub('① 고정비', /주차/.test(name)?'주차비':/KT|SK|통신|텔레콤|모바일/.test(name)?'통신':/전기|가스|수도/.test(name)?'공과금':/CLAUDE|ANTHROPIC|OPENAI|CHATGPT|네이버플러스/i.test(name)?'구독료':isLoan?loanSub:''));
    if(maj==='보험료') return R('② 보험료', sub('② 보험료', /종수/.test(name)?'종수':/지아/.test(name)?'지아':''));
    if(maj==='생활비') return R('④ 생활비', sub('④ 생활비', /미용|동물|펫|멍멍|구충/.test(name)?'반려동물':/식재료|마트|홈플러스|트레이더스|롯데마트|제타|이마트|계란|정육/.test(name)?'식재료':/배달|음식|식당|치킨|피자|탕|국밥|본점|카페|커피/.test(name)?'외식/배달':'생활용품'));
    if(maj==='데이트') return R('⑤ 데이트·힐링', min);
    if(maj==='지아용돈') return R('⑦ 지아 용돈', min);
    if(maj==='부모님' || maj==='엄마' || maj==='시부모님'){
      const item = /보험/.test(name+min)?'보험':/쉴더스|CCTV/i.test(name+min)?'CCTV':/헤모힘/.test(name+min)?'헤모힘':/선물/.test(name+min)?'선물':/용돈/.test(name+min)?'용돈':'';
      if(maj==='시부모님' || sidae.test(min+name)) return R('⑩ 시부모님', pickSub('⑩ 시부모님',item));
      return R('⑨ 엄마', pickSub('⑨ 엄마',item));
    }
    if(maj==='경조사') return R('⑪ 비정기','경조사');
    if(maj==='비정기') return R('⑪ 비정기', sub('⑪ 비정기', /교육|강의|클래스|버숑|다우데이타/.test(name)?'자기계발':/가전|가구/.test(name)?'가전/가구':''));
    if(maj==='건강') return R('⑧ 건강', sub('⑧ 건강', /수영|헬스|필라테스|요가|운동/.test(name)?'운동':/헤모힘/.test(name)?'헤모힘':/병원|의원|약국|한의원/.test(name)?'병원/약국':/ATOMY|애터미|영양/i.test(name)?'영양제':''));
    if(/^(교통비|차량교통|차량|교통|자동차)$/.test(maj)) return R('⑫ 차량·교통', sub('⑫ 차량·교통', /하이패스|도로공사/.test(name)?'하이패스':/주유|오일|에너지|칼텍스/i.test(name)?'기름값':/철도|코레일|SRT|버스|티머니/.test(name)?'대중교통':/정비|수리|세차|타이어|오일교환/.test(name)?'차량수리/유지비':''));
    if(maj==='종수용돈') return R('⑥ 종수 용돈', min);
    if(maj==='사업비') return R('🚫 사업비', sub('🚫 사업비', /ATOMY|애터미/i.test(name)?'애터미영업비':''));
    if(maj==='대납') return R('🚫 대납','',{person: who(inParen || dashWho || beforeParen)});
  }
  if(t==='수입'){
    if(maj==='대납대금') return R('🚫 대납 환급','',{person: who(beforeParen)});
    if(maj==='빌린돈') return R('🚫 빌린 돈', pickSub('🚫 빌린 돈',min), {person: who(beforeParen)});
    if(maj==='환불') return R('기타수입','환불·환급');
    if(maj==='기타' || maj==='기타수입') return R('기타수입', sub('기타수입', /환불|환급|연회비|취소/.test(name)?'환불·환급':'기타'));
    if(maj==='금융수입') return R('금융수입', sub('금융수입', /캐시백|당첨|적립|리워드/.test(name)?'앱테크':/배당/.test(name)?'배당금':'이자'));
    if(maj==='사업소득') return R('사업소득', sub('사업소득', /애터미/.test(name)?'애터미':/에이티|ATASSET/i.test(name)?'에이티에셋':/슈가펫/.test(name)?'슈가펫':/달내음/.test(name)?'달내음':''));
  }
  if(t==='이체'){
    if(maj==='빌린돈갚기') return R('빌린 돈 갚기', pickSub('빌린 돈 갚기',min), {person: who(beforeParen)});
    if(maj==='사업비이체'){
      if(isLoan || /대출/.test(min)) return R('① 고정비', /지아/.test(min)?'대출-지아':loanSub);   // 사업대출은 가계에서 냄
      if(/카드\s*(결제|출금|대금)/.test(name)) return R('🚫 카드대금', '');
      return R('🚫 사업 이체', sub('🚫 사업 이체', /슈가펫/.test(name)?'슈가펫':/달내음/.test(name)?'달내음':''));
    }
    if(maj==='계좌납부' || maj==='계좌이체납부'){
      const x=min+name;
      if(/대출|원리금|정책금/.test(x)) return R('① 고정비', /지아/.test(min)||/IBK|기업/.test(m)?'대출-지아':'대출-사업');
      if(/주차/.test(x)) return R('① 고정비','주차');
      if(/엄마/.test(min) || (/보험/.test(x) && /엄마/.test(name))) return R('⑨ 엄마', /보험/.test(x)?'보험':'');
      if(sidae.test(min)) return R('⑩ 시부모님','');
      if(/종신/.test(x)) return R('③ 저축','달러종신');
      if(/보험/.test(x)) return R('② 보험료', /종수/.test(x)?'종수':/지아/.test(x)?'지아':'');
      if(/경조|부주|축의|조의/.test(x)) return R('⑪ 비정기','경조사');
      if(/전기|가스|수도|관리비/.test(x)) return R('① 고정비','공과금');

    }
    if(maj==='가족송금'){
      if(amt>0) return R('🚫 내 통장끼리','계좌 이동');   // 받는 쪽 통장에 찍힌 건 빼기
      const x=minN+name;
      if(/종수/.test(x) || /오토바이/.test(name)) return R('⑥ 종수 용돈','');
      if(/데이트/.test(x)) return R('⑤ 데이트·힐링','');
      if(/지아/.test(x)) return R('⑦ 지아 용돈','');
      if(sidae.test(x)) return R('⑩ 시부모님','용돈');
      if(/엄마/.test(x)) return R('⑨ 엄마','용돈');
    }
    if(maj==='저축투자') return R('③ 저축', sub('③ 저축', /종신/.test(name)?'달러종신':/투자|주식/.test(name)?'투자':/저금통|동전|모으기/.test(name)?'저금통':'적금'));
    if(maj==='끼리끼리') return (/데이트/.test(name) && amt<0) ? R('⑤ 데이트·힐링','데이트') : R('🚫 내 통장끼리','계좌 이동');
    if(maj==='카드대금') return R('🚫 카드대금', min);
  }

  // ── 뱅크샐러드에서 새 분류 이름으로 바꿔둔 경우 ──
  if(/빌린돈갚기/.test(maj+minN)) return R('빌린 돈 갚기', pickSub('빌린 돈 갚기',min), {person:min});
  if(/빌린돈/.test(maj+minN)) return R('🚫 빌린 돈', pickSub('🚫 빌린 돈',min), {person:min});
  if(/^대납(환급|대금)/.test(maj) || (maj==='대납' && t==='수입')) return R('🚫 대납 환급','',{person:min});
  if(maj==='대납') return R('🚫 대납','',{person:min});
  if(maj==='가족송금'){
    if(/종수용돈/.test(minN)) return R('⑥ 종수 용돈','용돈');
    if(/지아용돈/.test(minN)) return R('⑦ 지아 용돈','용돈');
    if(/데이트/.test(minN)) return R('⑤ 데이트·힐링','데이트');
    if(/카드값/.test(minN)) return R('① 고정비','종수 카드값');
    if(/시부모|시어머니|시아버지/.test(minN)) return R('⑩ 시부모님','용돈');
    if(/엄마/.test(minN)) return R('⑨ 엄마','용돈');
  }
  if(maj==='계좌이체납부'){
    if(/보험/.test(minN)) return R('② 보험료', pickSub('② 보험료',min));
    if(/대출/.test(minN)) return R('① 고정비','대출-사업');

  }
  if(maj==='내통장끼리') return R('🚫 내 통장끼리', pickSub('🚫 내 통장끼리',min));
  if(maj==='사업이체') return R('🚫 사업 이체', pickSub('🚫 사업 이체',min));
  if(NO_MEMORY.test(name) && t!=='수입') return R(REVIEW);
  const direct = CATS.find(c=>c.name!==REVIEW && norm(c.name)===maj);
  if(direct){
    const okType = t==='수입' ? (INCOME_CATS.has(direct.name)||direct.name.startsWith('🚫'))
                 : t==='이체' ? maj!=='생활비' : true;
    if(okType) return R(direct.name, pickSub(direct.name,min));

  // ── 내용(가게 이름)으로 바로 알 수 있는 것 ──
  if(amt<0){
    if(/달내음/.test(name)) return R('🚫 사업 이체','달내음');
    if(/슈가펫/.test(name) && t==='이체') return R('🚫 사업 이체','슈가펫');
    if(/카드\s*(결제|출금|대금)/.test(name) && t==='이체'){
      const sub = /다이소/.test(name)?'다이소':/하나/.test(name)?'하나':/국민|KB/.test(name)?'KB':/신한/.test(name)?'신한':/삼성/.test(name)?'삼성':'기타';
      return R('🚫 카드대금', sub);
    }
    if(/원리금/.test(name) && /IBK|기업/.test(m)) return R('① 고정비','대출-지아');
    if(/굿네이버스|월드비전|유니세프|세이브더칠드런|기부/.test(name)) return R('⑦ 지아 용돈','기부');
    if(/CLAUDE|ANTHROPIC|네이버플러스|넷플릭스|유튜브|YOUTUBE|쿠팡와우|구독/i.test(name)) return R('① 고정비','구독');
    if(/달러종신|종신/.test(name)) return R('③ 저축','달러종신');
    if(/^\d{1,2}월\s*보험료$/.test(name)) return R('⑨ 엄마','보험');
    if(/쉴더스|CCTV/i.test(name)) return R('⑨ 엄마','CCTV');
    if(/보험료/.test(name)) return R('② 보험료','');
    if(/용돈|오토바이/.test(name)){
      if(/종수|오토바이/.test(name)) return R('⑥ 종수 용돈','용돈');

    }
    if(/데이트/.test(name)) return R('⑤ 데이트·힐링','데이트');
    if(t==='이체' && /이지아|이\*아/.test(name)) return R('🚫 내 통장끼리','계좌 이동');
    if(t==='이체' && /카카오페이|네이버페이|충전/.test(name)) return R('🚫 내 통장끼리','페이 충전');
  }

  // ── 수입 ──
  if(t==='수입'){
    if(maj==='앱테크') return R('금융수입','앱테크');
    if(maj==='금융수입') return R('금융수입','이자');
    if(maj==='사업수입'){

  // ── 이체 ──
  if(t==='이체'){
    if(maj==='카드대금'){

      return R('🚫 카드대금', sub);

    if(amt>0) return R('🚫 내 통장끼리','계좌 이동');      // 들어온 이체는 기본적으로 내 돈 이동
    if(maj==='저축') return R('③ 저축', /저금통|동전|모으기/.test(name)?'저금통':'적금');
    if(maj==='투자') return R('③ 저축','투자');

    if(/충전/.test(name)) return R('🚫 내 통장끼리','페이 충전');

    if(/^(이지아|이\*아|내계좌로 이체|내통장결제)$/.test(name)) return R('🚫 내 통장끼리','계좌 이동');
    if(maj==='생활비') return R('🚫 내 통장끼리','계좌 이동');
    return R(REVIEW);
  }

  // ── 지출: 결제수단 기본값 ──
  if(/토스뱅크\s*(체크카드|통장)/.test(m)) return R('⑦ 지아 용돈','용돈');
  if(/모임\s*체크카드/.test(m)) return R('⑤ 데이트·힐링', maj==='여행/숙박'?'여행':'데이트');
  if(/애터미/.test(m) || /ATOMY|애터미/i.test(name)) return R(REVIEW);   // 애터미는 집 물건·대납·영업용이 섞여서 매번 확인
  if(/다이소/.test(m)){
    if(/식재료|식비/.test(maj)) return R('④ 생활비','식재료');
    if(/외식|카페|간식/.test(maj)) return R('④ 생활비','외식/배달');
    if(/반려/.test(maj)) return R('④ 생활비','반려동물');
    return R('④ 생활비','생활용품');
  }
  // ── 지출: 뱅크샐러드 분류 ──
  if(/식재료/.test(maj)) return R('④ 생활비','식재료');
  if(/^(생활|생활비|생활용품|마트)$/.test(maj)) return R('④ 생활비','생활용품');
  if(/외식|카페|간식|배달/.test(maj)) return R('④ 생활비','외식/배달');
  if(/반려/.test(maj)) return R('④ 생활비','반려동물');
  if(/주거|통신/.test(maj)) return R('① 고정비','통신');
  if(maj==='대출') return R('① 고정비','대출-사업');
  if(/하이패스|도로공사/.test(name)) return R('⑫ 차량·교통','하이패스');
  if(/주유|오일|에너지|SK에너지|GS칼텍스|S-OIL|현대오일/i.test(name) || /주유/.test(maj)) return R('⑫ 차량·교통','기름값');
  if(/철도|코레일|SRT|티머니|고속버스|시외버스|버스/.test(name)) return R('⑫ 차량·교통','기차·버스');
  if(/자동차|교통/.test(maj)) return R('⑫ 차량·교통','');
  if(maj==='보험') return R('② 보험료','');
  if(/의료|건강|병원/.test(maj)) return R('⑧ 건강','병원·약');
  if(maj==='경조사') return R('⑪ 비정기','경조사');
  if(/데이트/.test(maj)) return R('⑤ 데이트·힐링','데이트');
  if(/여행/.test(maj)) return R('⑤ 데이트·힐링','여행');
  if(maj==='사업비') return R('🚫 사업비', /ATOMY|애터미/i.test(name)?'애터미 영업용':'기타');
  if(/KB국민카드/.test(m)) return R('① 고정비','');
  return R(REVIEW);
}

// 메모 규칙: "사업 12000", "대납 엄마 50000"
function memoSplits(memo){
  const out=[]; if(!memo) return out;
  const s=String(memo);
  for(const mm of s.matchAll(/사업\s*([\d,]+)/g)) out.push({kind:'biz', amount:+mm[1].replace(/,/g,'')});
  for(const mm of s.matchAll(/대납\s*([^\d\s,]+)\s*([\d,]+)/g)) out.push({kind:'adv', person:mm[1], amount:+mm[2].replace(/,/g,'')});
  return out.filter(x=>x.amount>0);
}

// 엑셀 → 원본 행
function excelDate(v){
  if(typeof v==='number') return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  if(v instanceof Date) return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  return String(v||'').trim().slice(0,10).replace(/[./]/g,'-');
}
function excelTime(v){
  if(typeof v==='number'){ let s=Math.round((v%1)*86400); const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); s-=m*60;
    return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':'); }
  if(v instanceof Date) return v.toTimeString().slice(0,8);
  return String(v||'').trim();
}
function parseBanksalad(wb){
  const name = wb.SheetNames.find(n=>n.includes('가계부')) || wb.SheetNames[wb.SheetNames.length-1];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
  const hi = rows.findIndex(r=>r && r.includes('날짜') && r.includes('금액'));
  if(hi<0) throw new Error('"가계부 내역" 시트에서 날짜/금액 칸을 못 찾았어요');
  const H = rows[hi]; const col = k => H.indexOf(k);
  const C = {d:col('날짜'),t:col('시간'),ty:col('타입'),ma:col('대분류'),mi:col('소분류'),ct:col('내용'),am:col('금액'),me:col('결제수단'),mo:col('메모')};
  return rows.slice(hi+1).filter(r=>r && r[C.d]!=null && r[C.am]!=null).map(r=>({
    date: excelDate(r[C.d]), time: excelTime(r[C.t]), type: String(r[C.ty]||'').trim(),
    bs_major: r[C.ma]??'', bs_minor: r[C.mi]??'', merchant: String(r[C.ct]??'').trim(),
    amount: Math.round(Number(r[C.am])||0), method: String(r[C.me]??'').trim(), memo: r[C.mo]? String(r[C.mo]).trim():''
  }));
}

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}));

// 원본 행 → 저장할 행들 (부모 먼저, 메모 나누기 자식 뒤에)
function buildImport(raw, month, rules){
  const seen={}, parents=[], children=[];
  for(const r of raw){
    const base=[r.date,r.time,r.amount,r.merchant,r.method].join('|');
    seen[base]=(seen[base]||0)+1;
    if(!r.date.startsWith(month)) continue;
    const key = base+'|'+seen[base];
    const c = classify(r, rules);
    const p = {id:uuid(), month, ...r, category:c.category, subcategory:c.subcategory||'', person:c.person||null, dedupe_key:key, parent_id:null};
    p.treatment = treatmentOf(p.category, p);
    if(r.type!=='수입' && r.amount<0){
      memoSplits(r.memo).forEach((s,i)=>{
        if(s.amount >= -p.amount) return;
        p.amount += s.amount;
        const ch = {id:uuid(), month, date:r.date, time:r.time, type:r.type, bs_major:r.bs_major, bs_minor:r.bs_minor,
          merchant:r.merchant, method:r.method, memo:'메모로 나눔', amount:-s.amount, parent_id:p.id, dedupe_key:key+'#m'+(i+1),
          category: s.kind==='biz'?'🚫 사업비':'🚫 대납', subcategory: s.kind==='biz'?'기타':'', person: s.person||null};
        ch.treatment = treatmentOf(ch.category, ch);
        children.push(ch);
      });
    }
    parents.push(p);
  }
  return {parents, children};
}

// 한 달 요약
function summarize(tx, budgets){
  const s={income:0, expense:0, savings:0, review:0, byCat:{}, incomeByCat:{}, env:{}, bizLoan:0, sugarpet:0};
  for(const c of EXP_CATS) s.byCat[c]=0;
  for(const r of tx){
    if(r.treatment==='review') s.review++;
    if(r.treatment==='income'){ s.income+=r.amount; s.incomeByCat[r.category]=(s.incomeByCat[r.category]||0)+r.amount; if(/^슈가펫/.test(r.subcategory||'')) s.sugarpet+=r.amount; }
    if(r.treatment==='count'){ s.expense+=-r.amount; s.byCat[r.category]=(s.byCat[r.category]||0)-r.amount; }
    if(r.treatment==='savings') s.savings+=-r.amount;
    if(ENV[r.category]){
      const e = s.env[r.category] ||= {funded:0, used:0, other:0};
      if(r.treatment==='count'){ if(r.type==='이체' || /데이트\s*비|용돈/.test(r.merchant||'')) e.funded+=-r.amount; else e.other+=-r.amount; }
      if(r.treatment==='envelope') e.used+=-r.amount;
    }
    if(r.category==='① 고정비' && r.subcategory==='대출-사업' && r.treatment==='count') s.bizLoan+=-r.amount;
  }
  for(const c in s.env){ const e=s.env[c]; if(!e.funded && e.used>0){ s.byCat[c]=(s.byCat[c]||0)+e.used; s.expense+=e.used; e.noFund=true; } }
  s.budget={}; for(const b of budgets||[]) s.budget[b.category]=(s.budget[b.category]||0)+(Number(b.amount)||0);
  s.net = s.income - s.expense - s.savings;
  return s;
}
// 대납·빌린 돈 (전체 기간)
function debtBook(rows){
  const adv={}, borrow={};
  for(const r of rows){
    const who = r.person || r.subcategory || r.merchant || '이름 없음';
    if(r.treatment==='advance') adv[who]=(adv[who]||0)-r.amount;            // 대신 냄 (+)
    if(r.treatment==='advance_refund') adv[who]=(adv[who]||0)-r.amount;     // 돌려받음 (-)
    if(r.treatment==='borrow') borrow[who]=(borrow[who]||0)+r.amount;       // 빌림 (+)
    if(r.category==='빌린 돈 갚기') borrow[who]=(borrow[who]||0)+r.amount;  // 갚음 (-)
  }
  return {adv, borrow};
}

async function importFile(f){

function tipOn(ev, text){ const t=$('tip'); t.textContent=text; t.classList.add('on'); const x=Math.min(ev.clientX+12, innerWidth-t.offsetWidth-8); t.style.left=x+'px'; t.style.top=(ev.clientY-36)+'px'; }
function tipOff(){ $('tip').classList.remove('on'); }

function trendChart(){

  const gw=(W-pl-pr)/d.length, bw=Math.min(22,(gw-14)/2), y=v=>pt+(H-pt-pb)*(1-v/max), base=H-pb;

      <text x="${W-pr}" y="${pt-6}" text-anchor="end" font-size="11" fill="var(--sub)">최대 ${short(max)}원</text>${svg}</svg>

function catOptions(sel){
  const groups=[...new Set(CATS.map(c=>c.group))];
  return groups.map(g=>`<optgroup label="${g}">${CATS.filter(c=>c.group===g).map(c=>`<option ${c.name===sel?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`).join('');
}
function subsFor(cat){
  const c=catOf(cat); const set=new Set(c?c.subs:[]);
  (S.tx||[]).forEach(r=>{ if(r.category===cat && r.subcategory) set.add(r.subcategory); });
  (S.rules||[]).forEach(r=>{ if(r.category===cat && r.subcategory) set.add(r.subcategory); });
  return [...set];
}
function subOptions(cat, sel){
  const list=subsFor(cat); if(sel && !list.includes(sel)) list.push(sel);
  return `<option value="">소분류</option>`+list.map(s=>`<option ${s===sel?'selected':''}>${esc(s)}</option>`).join('')+`<option value="__new">＋ 새 소분류…</option>`;
}
const FILTERS = [['new','🆕 방금 올린 것'],['all','전체'],['review','❓ 확인 필요'],['count','지출'],['income','수입'],['envelope','봉투'],['excluded','가계 제외']];
function renderLedger(){

  let list=S.tx.filter(r=>{
    if(f==='all') return true;
    if(f==='new') return S.lastImport ? S.lastImport.has(r.id) : false;
    if(f==='excluded') return ['exclude','advance','advance_refund','borrow','borrow_repay'].includes(r.treatment);
    return r.treatment===f;
  }).filter(r=>(!S.catFilter || r.category===S.catFilter) && (!S.search || (r.merchant+' '+(r.subcategory||'')+' '+(r.memo||'')+' '+(r.person||'')).toLowerCase().includes(S.search.toLowerCase())));
  const catsHere=[...new Set(S.tx.map(r=>r.category))].sort((a,b)=>CATS.findIndex(c=>c.name===a)-CATS.findIndex(c=>c.name===b));
  const listSum=list.reduce((a,r)=>a+r.amount,0);
  const byParent={}; S.tx.forEach(r=>{ if(r.parent_id) (byParent[r.parent_id] ||= []).push(r); });
  const ordered=[]; list.filter(r=>!r.parent_id || f!=='all').forEach(r=>{ ordered.push(r); if(f==='all') (byParent[r.id]||[]).forEach(c=>ordered.push(c)); });
  $('view').innerHTML = `

      <input id="ledSearch" value="${esc(S.search)}" placeholder="🔍 가게·메모 찾기" oninput="S.search=this.value;clearTimeout(window._st);window._st=setTimeout(()=>{renderLedger();const e=$('ledSearch');e.focus();e.setSelectionRange(e.value.length,e.value.length)},300)" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px">
    </div>
    ${(S.catFilter||S.search)?`<div class="row between muted" style="margin-top:8px"><span>${list.length}건 · 합계 <b class="num" style="color:var(--ink)">${won(listSum)}</b></span><button class="btn small" onclick="S.catFilter='';S.search='';renderLedger()">필터 지우기</button></div>`:''}
    <div class="row between" style="margin-top:10px">
      <label class="muted row" style="gap:4px"><input type="checkbox" ${S.remember?'checked':''} onchange="S.remember=this.checked"> 바꾼 가게는 기억하기</label>

function txHtml(r){
  const tagMap={envelope:['env','봉투 안'],exclude:['exc','가계 제외'],advance:['exc','대납'],advance_refund:['exc','대납 환급'],borrow:['exc','빌린 돈'],borrow_repay:['exc','빚 갚음'],savings:['env','저축']};
  const tg=tagMap[r.treatment];
  const showPerson = ['advance','advance_refund','borrow'].includes(r.treatment) || r.category==='빌린 돈 갚기';
  return `<div class="tx ${r.treatment==='review'?'review':''} ${r.parent_id?'child':''}">
    <div class="t1"><span>${r.parent_id?'↳ ':''}${esc(r.merchant)||'(내용 없음)'}</span><span class="num ${r.amount>0?'plus':'minus'}">${r.amount>0?'+':''}${won(r.amount)}</span></div>
    <div class="t2">${r.date.slice(5).replace('-','/')} ${esc((r.time||'').slice(0,5))} · ${esc(r.type)} · ${esc(r.method)}${r.bs_major?` · 뱅샐 ${esc(r.bs_major)}`:''}</div>
    <div class="t3">
      <select onchange="changeCat('${r.id}',this.value)">${catOptions(r.category)}</select>
      ${['🚫 대납','🚫 대납 환급','❓ 확인 필요'].includes(r.category)?'':`<select onchange="changeSub('${r.id}',this.value)">${subOptions(r.category,r.subcategory)}</select>`}
      ${showPerson?`<button class="btn small" onclick="setPerson('${r.id}')">👤 ${esc(r.person||'누구?')}</button>`:''}
      ${tg?`<span class="tag ${tg[0]}">${tg[1]}</span>`:''}
      ${r.memo?`<span class="tag memo">📝 ${esc(r.memo)}</span>`:''}
      <span style="flex:1"></span>
      ${r.parent_id?`<button class="btn small" onclick="unsplit('${r.id}')">합치기</button>`:`<button class="btn small" onclick="openSplit('${r.id}')">나누기</button>`}
      ${r.dedupe_key?.startsWith('manual')?`<button class="btn small" onclick="delTx('${r.id}')">삭제</button>`:''}
    </div></div>`;
}
const findTx = id => S.tx.find(r=>r.id===id);
async function saveTx(r, patch){
  Object.assign(r, patch); r.treatment = treatmentOf(r.category, r);
  const {error} = await sb.from('transactions').update({...patch, treatment:r.treatment}).eq('id', r.id);
  return !fail(error);
}
async function changeCat(id, cat){
  const r=findTx(id); const old=r.category;
  const patch={category:cat, subcategory:''};
  if(['🚫 대납','🚫 대납 환급','🚫 빌린 돈','빌린 돈 갚기'].includes(cat) && !r.person){
    const p=prompt('누구인가요? (예: 엄마, 시어머니, 친구 이름)', ''); if(p) patch.person=p.trim();
  }
  if(!await saveTx(r, patch)) return;
  let n=0;
  if(S.remember && r.merchant && !r.parent_id && !NO_MEMORY.test(r.merchant)){
    await sb.from('rules').upsert({match_field:'merchant', match_value:r.merchant, category:cat, subcategory:''},{onConflict:'match_field,match_value'});
    const ru=S.rules.find(x=>x.match_field==='merchant'&&x.match_value===r.merchant);
    if(ru){ ru.category=cat; ru.subcategory=''; } else S.rules.push({match_field:'merchant',match_value:r.merchant,category:cat,subcategory:''});
    for(const o of S.tx.filter(o=>o!==r && !o.parent_id && o.merchant===r.merchant && (o.category===old || o.category===REVIEW))){
      if(await saveTx(o,{category:cat, subcategory:''})) n++;
    }
  }
  renderLedger(); toast(n?`같은 가게 ${n}건도 바꿨어요`:'바꿨어요');
}
async function changeSub(id, sub){
  if(sub==='__new'){ sub=(prompt('새 소분류 이름','')||'').trim(); if(!sub){ renderLedger(); return; } }
  const r=findTx(id); if(!await saveTx(r,{subcategory:sub})) return;
  if(S.remember && r.merchant && !r.parent_id && !NO_MEMORY.test(r.merchant)){
    await sb.from('rules').upsert({match_field:'merchant', match_value:r.merchant, category:r.category, subcategory:sub},{onConflict:'match_field,match_value'});
    const ru=S.rules.find(x=>x.match_field==='merchant'&&x.match_value===r.merchant); if(ru) ru.subcategory=sub;
  }
  if(['🚫 빌린 돈','빌린 돈 갚기'].includes(r.category) && !r.person) await saveTx(r,{person:sub});
  renderLedger(); toast('바꿨어요');
}
async function setPerson(id){
  const r=findTx(id); const p=prompt('누구인가요?', r.person||''); if(p===null) return;
  if(await saveTx(r,{person:p.trim()||null})){ await loadAll(); renderLedger(); }
}

function openSplit(id){

  openModal(`<h2>나누기</h2><p class="muted">${esc(r.merchant)} ${won(r.amount)}에서 일부를 떼어 다른 분류로 보내요.</p>

}
async function doSplit(id){
  const r=findTx(id); const x=Math.abs(Number($('spAmt').value.replace(/[^\d]/g,'')));
  if(!x || x>=Math.abs(r.amount)){ toast('금액을 확인해 주세요'); return; }
  const sign = r.amount<0?-1:1;
  const ch={id:uuid(), month:r.month, date:r.date, time:r.time, type:r.type, bs_major:r.bs_major, bs_minor:r.bs_minor, merchant:r.merchant,
    method:r.method, memo:'나눔', amount:sign*x, parent_id:r.id, dedupe_key:r.dedupe_key+'#s'+Date.now(),
    category:$('spCat').value, subcategory:$('spSub').value||'', person:$('spWho').value.trim()||null};
  ch.treatment=treatmentOf(ch.category,ch);
  const a = await sb.from('transactions').insert(ch); if(fail(a.error)) return;
  if(!await saveTx(r,{amount:r.amount - sign*x})) return;
  closeModal(); await loadAll(); renderLedger(); toast('나눴어요');
}
async function unsplit(id){
  const c=findTx(id); const p=findTx(c.parent_id);
  if(!confirm('원래 내역으로 합칠까요?')) return;
  if(p && !await saveTx(p,{amount:p.amount + c.amount})) return;
  const {error}=await sb.from('transactions').delete().eq('id',id); if(fail(error)) return;
  await loadAll(); renderLedger(); toast('합쳤어요');
}

async function saveLoan(id, field, v){
  let val=v;
  if(['monthly_amount','balance','pay_day'].includes(field)) val = v===''?null:Number(String(v).replace(/[^\d]/g,''));
  if(field==='rate') val = v===''?null:Number(v);
  if(field==='grace_end' && !v) val=null;
  const {error}=await sb.from('loans').update({[field]:val}).eq('id',id); if(fail(error)) return;
  const l=S.loans.find(x=>x.id===id); l[field]=val; if(['monthly_amount','active','grace_end'].includes(field)) renderLoans(); toast('저장했어요');
}

let _saveT=null;

const SHIM = `<script>(function(){var P=parent,st=P.__mealState;var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(st,k)?st[k]:null},setItem:function(k,v){st[k]=String(v);P.__saveMealState()},removeItem:function(k){delete st[k];P.__saveMealState()},clear:function(){for(var k in st)delete st[k];P.__saveMealState()},key:function(i){return Object.keys(st)[i]||null},get length(){return Object.keys(st).length}};try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();<\/script>`;
function withShim(html){
  if(/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, m=>m+SHIM);
  return SHIM+html;
}

async function saveFridge(id){

async function fridgeQty(id, k){
  const f=S.fridge.find(x=>x.id===id); const q=Math.max(0,(Number(f.qty)||0)+k);
  if(q===0 && confirm(`${f.name}을(를) 다 먹었나요? 냉장고에서 뺄게요.`)) return delFridge(id,true);
  const {error}=await sb.from('fridge_items').update({qty:q, updated_at:new Date().toISOString()}).eq('id',id); if(fail(error)) return;
  f.qty=q; renderFridge();

async function delFridge(id, silent){

async function reloadFood(){

const SLOTS=['아침','저녁'];
function renderMeals(){
  const [y,mo]=S.month.split('-').map(Number); const last=new Date(y,mo,0).getDate();
  const W='일월화수목금토'; const today=todayStr();
  let html='', week='';
  for(let d=1; d<=last; d++){
    const ds=`${S.month}-${String(d).padStart(2,'0')}`; const wd=new Date(y,mo-1,d).getDay();
    const cells = SLOTS.map(sl=>{ const m=S.meals.find(x=>x.date===ds && x.slot===sl);
      const miss = m ? (m.ingredients||[]).filter(i=>!have(i)).length : 0;
      return `<button class="btn small" style="flex:1;text-align:left;min-width:0;${m?'':'color:var(--sub)'}" onclick="openMeal('${ds}','${sl}')">
        <span class="muted">${sl}</span> ${m?esc(m.menu):'＋'}${m&&m.recipe?' 📖':''}${m&&miss?` <span class="tag memo">재료 ${miss}</span>`:''}</button>`; }).join('');
    week += `<div class="row" style="gap:6px;padding:5px 0;${ds===today?'background:var(--accent-soft);border-radius:8px;padding:5px 4px':''}">
      <span class="num" style="width:58px;font-size:13px;color:${wd===0?'var(--red)':wd===6?'var(--accent)':'var(--sub)'}">${mo}/${d} ${W[wd]}</span>${cells}</div>`;

    <div class="row between" style="margin-top:12px"><span class="muted">${planned}끼 계획됨 · 사야 할 재료 ${missAll.size}가지</span>
    <button class="btn small" onclick="S.foodTab='shop';renderFood()">장보기로 →</button></div>${html}`;
}
function openMeal(date, slot){
  const m=S.meals.find(x=>x.date===date && x.slot===slot) || {menu:'',ingredients:[]};
  const ing=(m.ingredients||[]);
  openModal(`<h2>${date.slice(5).replace('-','/')} ${slot}</h2>
    <label class="field">메뉴<input id="mlMenu" value="${esc(m.menu||'')}" placeholder="예: 닭가슴살 원팬 볶음밥"></label>

    ${ing.length?`<p class="muted">${ing.map(i=>have(i)?`✓ ${esc(i)}`:`<b style="color:var(--accent)">✗ ${esc(i)}</b>`).join(' · ')}</p>`:''}
    <label class="field">레시피<textarea id="mlRecipe" rows="6" style="border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font:inherit;color:var(--ink);resize:vertical">${esc(m.recipe||'')}</textarea></label>

async function saveMeal(date, slot){
  const menu=$('mlMenu').value.trim(); const ingredients=$('mlIng').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  const recipe=$('mlRecipe').value.trim()||null;
  if(!menu){ toast('메뉴를 넣어주세요'); return; }
  const dates=[date];
  if($('mlRepeat').checked){ let d=new Date(date); for(;;){ d=new Date(d.getTime()+7*864e5); const s=d.toISOString().slice(0,10); if(!s.startsWith(S.month)) break; dates.push(s); } }
  for(const ds of dates){
    const ex=S.meals.find(x=>x.date===ds && x.slot===slot);
    const q = ex ? sb.from('meal_plans').update({menu,ingredients,recipe}).eq('id',ex.id) : sb.from('meal_plans').insert({date:ds,slot,menu,ingredients,recipe});
    const {error}=await q; if(fail(error)) return;
  }
  closeModal(); await reloadFood(); toast(dates.length>1?`${dates.length}끼 넣었어요`:'저장했어요');
}

function openAiPaste(){

function parseAiJson(text){
  const block = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  let s = block ? block[1] : text; const a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a<0||b<0) throw new Error('JSON을 못 찾았어요');
  return JSON.parse(s.slice(a,b+1));
}
async function applyAi(){
  let data; try{ data=parseAiJson($('aiResult').value); }catch(e){ toast('읽기 실패: '+e.message); return; }
  const month = String(data.month||S.month).slice(0,7);
  const meals = (data.meals||[]).filter(m=>m.date && m.menu && String(m.date).startsWith(month)).map(m=>({
    date:String(m.date).slice(0,10), slot: m.slot==='아침'?'아침':'저녁', menu:String(m.menu).trim(),
    ingredients:(Array.isArray(m.ingredients)?m.ingredients:String(m.ingredients||'').split(',')).map(x=>String(x).trim()).filter(Boolean),
    recipe: m.recipe? String(m.recipe).replace(/\\n/g,'\n') : null }));
  const shop = (data.shopping||[]).filter(i=>i.name).map(i=>({month, name:String(i.name).trim(), qty:Number(i.qty)||null, unit:i.unit||null,
    store: STORES.includes(i.store)?i.store:(i.store?'기타':null), est_price:Number(String(i.est_price??'').replace(/[^\d]/g,''))||null, checked:false}));
  if(!meals.length && !shop.length){ toast(month+' 식단이나 장보기가 없어요'); return; }
  if(month!==S.month){ S.month=month; $('month').value=month; }
  const replace=$('aiReplace').checked;
  if(replace && meals.length){
    const d1=await sb.from('meal_plans').delete().in('date',[...new Set(meals.map(m=>m.date))]); if(fail(d1.error)) return;
  }
  const exist = replace ? [] : (await sb.from('meal_plans').select('date,slot').gte('date',month+'-01').lt('date',shiftMonth(month,1)+'-01')).data||[];
  const taken=new Set(exist.map(e=>e.date+e.slot));
  const newMeals=meals.filter(m=>!taken.has(m.date+m.slot));
  if(newMeals.length){ const r=await sb.from('meal_plans').insert(newMeals); if(fail(r.error)) return; }
  const cur=(await sb.from('shopping_items').select('name').eq('month',month)).data||[];
  const had=new Set(cur.map(i=>nkey(i.name)));
  const newShop=shop.filter(i=>!had.has(nkey(i.name)));
  if(newShop.length){ const r=await sb.from('shopping_items').insert(newShop); if(fail(r.error)) return; }
  closeModal(); await loadAll(); S.foodTab='meals'; go('food');
  toast(`식단 ${newMeals.length}끼 · 장보기 ${newShop.length}가지를 넣었어요`);
}

        <input inputmode="numeric" placeholder="가격" value="${i.est_price??''}" onchange="saveShop('${i.id}',{est_price:Number(this.value.replace(/[^\\d]/g,''))||null})" style="width:72px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 6px;font-size:13px">
        <select onchange="saveShop('${i.id}',{store:this.value})" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px;font-size:12px;max-width:84px"><option value="">매장?</option>${STORES.map(s=>`<option ${i.store===s?'selected':''}>${s}</option>`).join('')}</select>
        <button class="ghost" onclick="delShop('${i.id}')">✕</button></div>`).join('')}</div>`).join('') || '<p class="muted" style="margin-top:16px">목록이 비어 있어요.</p>'}
    ${done?`<button class="btn primary" style="width:100%;margin-top:14px" onclick="shopToFridge()">✓ 산 것 ${done}개 냉장고로 옮기기</button>`:''}`;
}
async function addShop(){
  const name=$('shName').value.trim(); if(!name) return;
  const {error}=await sb.from('shopping_items').insert({month:S.month, name, store:$('shStore').value}); if(fail(error)) return;
  await reloadFood(); setTimeout(()=>$('shName')?.focus(),50);
}
async function saveShop(id, patch){ const {error}=await sb.from('shopping_items').update(patch).eq('id',id); if(fail(error)) return; Object.assign(S.shop.find(i=>i.id===id),patch); renderShop(); }
async function toggleShop(id, v){ await saveShop(id,{checked:v}); }
async function delShop(id){ const {error}=await sb.from('shopping_items').delete().eq('id',id); if(fail(error)) return; await reloadFood(); }
async function shopFromMeals(){
  const need={}; S.meals.forEach(m=>(m.ingredients||[]).forEach(i=>{ if(!have(i)) need[i]=(need[i]||0)+1; }));
  const already=new Set(S.shop.map(i=>nkey(i.name)));
  const rows=Object.entries(need).filter(([n])=>!already.has(nkey(n))).map(([name,c])=>({month:S.month, name, note:null, qty:null, store:null}));
  if(!rows.length){ toast(S.meals.length?'새로 담을 재료가 없어요 (냉장고에 있거나 이미 목록에 있음)':'식단을 먼저 짜주세요'); return; }
  const {error}=await sb.from('shopping_items').insert(rows.map(({note,...r})=>r)); if(fail(error)) return;
  await reloadFood(); toast(`재료 ${rows.length}가지를 담았어요. 매장을 골라주세요`);
}
async function shopToFridge(){
  const done=S.shop.filter(i=>i.checked);
  if(!confirm(`${done.length}개를 냉장고(냉장)로 옮길까요? 위치·기한은 냉장고 탭에서 고칠 수 있어요.`)) return;
  for(const i of done){
    const ex=S.fridge.find(f=>nkey(f.name)===nkey(i.name));
    if(ex) await sb.from('fridge_items').update({qty:(Number(ex.qty)||0)+(Number(i.qty)||1), updated_at:new Date().toISOString()}).eq('id',ex.id);
    else await sb.from('fridge_items').insert({name:i.name, location:'냉장', qty:i.qty||1, unit:i.unit||'개'});
  }
  const {error}=await sb.from('shopping_items').delete().in('id',done.map(i=>i.id)); if(fail(error)) return;
  S.foodTab='fridge'; await reloadFood(); toast('냉장고에 넣었어요');
}

sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ $('app').hidden=true; $('login').hidden=false; } });
boot();
</script>
